openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
#DTO
components:
  schemas:
    ProdottoDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
        descrizioneBreve:
          type: string
        descrizioneEstesa:
          type: string
        categoria:
          type: string
        immagine:
          type: string
        disponibilita:
          type: integer
          format: int32
        prezzo:
          type: number
          format: double



    PaginatedResponse:
      type: object
      properties:
        totalPages:
          type: integer
        totalElements:
          type: integer
        content:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ProdottoDto'


    UtenteDto:
      type: object
      required:
        - nome
        - cognome
        - email
      properties:
        id:
          type: string
        uuid:
          type: string
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        numero:
          type: string
        indirizzo:
          type: string
        ruolo:
          type: string

    JwtResponse:
      type: object
      properties:
        token:
          type: string
        utente:
          $ref: '#/components/schemas/UtenteDto'

    StatoDto:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        codice:
          type: string
        descrizione:
          type: string

    RigaCarrelloDto:
      type: object
      properties:
        id:
          type: integer
        prodotto:
          $ref: '#/components/schemas/ProdottoDto'
        quantita:
          type: integer

    CarrelloDto:
      type: object
      properties:
        id:
          type: integer
        stato:
          type: string
        dataCreazione:
          type: string
          format: date-time
        righe:
          type: array
          items:
            $ref: '#/components/schemas/RigaCarrelloDto'

    OrdineDto:
      type: object
      properties:
        dataCreazione:
          type: string
          format: date-time
        indirizzoSpedizione:
          type: string
        indirizzoFatturazione:
          type: string
        importo:
          type: number
        codice:
          type: string
        stato:
          $ref: '#/components/schemas/StatoDto'

    RigaOrdineDto:
      type: object
      properties:
        prezzoRiga:
          type: number
        prezzoUnitario:
          type: number
        dataCreazione:
          type: string
          format: date-time
        rigaCarrelloId:
          type: integer
        quantita:
          type: integer
        prodotto:
          $ref: '#/components/schemas/ProdottoDto'
        carrello:
          $ref: '#/components/schemas/CarrelloDto'

  parameters:
    #Prodotti
    NomeProdotto:
      name: nome
      in: query
      required: false
      schema:
        type: string
    Categoria:
      name: categoria
      in: query
      required: false
      schema:
        type: string
    DescrizioneBreve:
      name: descrizioneBreve
      in: query
      required: false
      schema:
        type: string
    Sku:
      name: sku
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
    Elements:
      name: elements
      in: query
      required: false
      schema:
        type: integer
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string


#API

paths:
  /api/products/catalog:
    get:
      tags:
        - Products
      operationId: getCatalog
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdottoDto'


  /api/admin/products:
    get:
      tags:
        - Admin
      operationId: searchProductsAdmin
      parameters:
        - $ref: '#/components/parameters/NomeProdotto'
        - $ref: '#/components/parameters/Categoria'
        - $ref: '#/components/parameters/DescrizioneBreve'
        - $ref: '#/components/parameters/Sku'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Elements'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Pagina di prodotti recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'



  /api/admin/products/{id}:
    patch:
      tags:
        - Admin
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdottoDto'
      responses:
        '200':
          description: Prodotto aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdottoDto'

    delete:
      tags:
        - Admin
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Prodotto eliminato con successo


  /api/cart/{userId}:
    get:
      tags:
        - Carts
      operationId: getCart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Carrello attivo dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrelloDto'

    post:
      tags:
        - Carts
      operationId: createCart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Carrello creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrelloDto'




  /api/cart/{cartId}/add:
    post:
      tags:
        - Carts
      operationId: addToCart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RigaCarrelloDto'
      responses:
        '200':
          description: Riga aggiunta al carrello dal catalogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RigaCarrelloDto'




  /api/cart/{rowId}:
    patch:
      tags:
        - Carts
      operationId: updateRow
      parameters:
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RigaCarrelloDto'
      responses:
        '200':
          description: Quantità della row aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RigaCarrelloDto'
    delete:
      tags:
        - Carts
      operationId: deleteRow
      parameters:
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Riga eliminata




  /api/order/{userId}/checkout:
    post:
      tags:
        - Orders
      operationId: checkout
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdineDto'
      responses:
        '200':
          description: Riga aggiunta al carrello dal catalogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdineDto'