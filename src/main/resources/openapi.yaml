openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
#DTO
components:
  schemas:
    ProdottoDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
        descrizioneBreve:
          type: string
        descrizioneEstesa:
          type: string
        immagine:
          type: string
        disponibilita:
          type: integer
          format: int32
        prezzo:
          type: number
          format: double

    RuoloDto:
      type: object
      properties:
        nome:
          type: string
        descrizione:
          type: string

    UtenteDto:
      type: object
      required:
        - nome
        - cognome
        - email
        - numero
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        numero:
          type: string
          minLength: 1
        indirizzo:
          type: string
        ruolo:
          $ref: '#/components/schemas/RuoloDto'

    JwtResponse:
      type: object
      properties:
        token:
          type: string
        utente:
          $ref: '#/components/schemas/UtenteDto'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    RegisterRequest:
      type: object
      required:
        - nome
        - cognome
        - email
        - password
        - passwordConf
        - numero
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        passwordConf:
          type: string
          minLength: 1
        numero:
          type: string
          minLength: 1
        indirizzo:
          type: string

    StatoDto:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        codice:
          type: string
        descrizione:
          type: string

    RigaCarrelloDto:
      type: object
      properties:
        id:
          type: integer
        prodotto:
          $ref: '#/components/schemas/ProdottoDto'
        quantita:
          type: integer

    CarrelloDto:
      type: object
      properties:
        id:
          type: integer
        stato:
          type: string
        dataCreazione:
          type: string
          format: date-time
        righe:
          type: array
          items:
            $ref: '#/components/schemas/RigaCarrelloDto'

    OrdineDto:
      type: object
      properties:
        dataCreazione:
          type: string
          format: date-time
        indirizzoSpedizione:
          type: string
        indirizzoFatturazione:
          type: string
        importo:
          type: number
        codice:
          type: string
        stato:
          $ref: '#/components/schemas/StatoDto'

    RigaOrdineDto:
      type: object
      properties:
        prezzoRiga:
          type: number
        prezzoUnitario:
          type: number
        dataCreazione:
          type: string
          format: date-time
        rigaCarrelloId:
          type: integer
        quantita:
          type: integer
        prodotto:
          $ref: '#/components/schemas/ProdottoDto'
        carrello:
          $ref: '#/components/schemas/CarrelloDto'




#API

paths:
  /api/products/catalog:
    get:
      tags:
        - Products
      operationId: getCatalog
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdottoDto'



  /api/user/register:
    post:
      tags:
        - Users
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utente registratocon successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'


  /api/user/login:
    post:
      tags:
        - Users
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'


  /api/admin/user:
    get:
      tags:
        - Admin
      operationId: searchUserAdmin
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: cognome
          in: query
          required: false
          schema:
            type: string
        - name: numero
          in: query
          required: false
          schema:
            type: string
        - name: ruolo
          in: query
          required: false
          schema:
            type: string
        - name: dataInizio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dataFine
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista utenti con diversi filtri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtenteDto'



  /api/cart/{userId}:
    get:
      tags:
        - Carts
      operationId: getCart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Carrello attivo dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrelloDto'



  /api/cart/{cartId}/add:
    post:
      tags:
        - Carts
      operationId: addToCart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RigaCarrelloDto'
      responses:
        '200':
          description: Riga aggiunta al carrello dal catalogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RigaCarrelloDto'




  /api/cart/{rowId}:
    patch:
      tags:
        - Carts
      operationId: updateRow
      parameters:
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RigaCarrelloDto'
      responses:
        '200':
          description: Quantità della row aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RigaCarrelloDto'
    delete:
      tags:
        - Carts
      operationId: deleteRow
      parameters:
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Riga eliminata




  /api/order/{userId}/checkout:
    post:
      tags:
        - Orders
      operationId: checkout
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdineDto'
      responses:
        '200':
          description: Riga aggiunta al carrello dal catalogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdineDto'